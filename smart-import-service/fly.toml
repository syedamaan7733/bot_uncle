app = 'smart-import'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[processes]
  app = 'uvicorn app.main:app --host :: --port 8000'

[env]
  PYTHONUNBUFFERED = '1'
  PORT = '8000'
  LAYOUT_WARMUP = 'false'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '60s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '4gb'
  cpu_kind = 'shared'
  cpus = 2