# Fly.io app: https://fly.io/docs/reference/configuration/
app = "bot-uncle"
primary_region = "iad"

[build]
  dockerfile = "backend/Dockerfile"

[deploy]
  release_command = "npx prisma@5.22.0 migrate deploy"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
