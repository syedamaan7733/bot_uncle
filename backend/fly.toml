# fly.toml app configuration file generated for bot-uncle on 2026-05-31T06:58:33Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'botuncle-backend'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = 'npm run prisma:migrate:deploy'

[processes]
  app = 'npm run start:pm2'

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  TRUST_PROXY = '1'
  FRONTEND_URL = 'https://botuncle.fly.dev'
  PYTHON_SERVICE_URL = 'http://smart-import.internal:8000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '45s'
    method = 'GET'
    path = '/health/live'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
